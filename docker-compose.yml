services:
  backend:
    build:
      context: .
      dockerfile: ./be_src/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./be_src:/app/be_src
    command: uvicorn be_src.apps.main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    build: ./fe_src
    ports:
      - "5173:5173"
    volumes:
      - ./fe_src:/app
